
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NyayaMithra | Professional Legal AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --midnight: #020617;
            --gold: #d97706;
            --gold-light: #f59e0b;
        }

        body { font-family: 'Inter', sans-serif; }
        h1, h2, .font-serif { font-family: 'Playfair Display', serif; }

        .glass-sidebar { 
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.98) 0%, rgba(2, 6, 23, 1) 100%);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .gold-gradient {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
        
        /* Markdown Professional Styles */
        .markdown-content { font-size: 0.95rem; line-height: 1.7; color: #334155; }
        .markdown-content h1, .markdown-content h2 { color: var(--midnight); margin-top: 1.5rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 0.5rem; }
        .markdown-content strong { color: #1e293b; font-weight: 600; }
        .markdown-content blockquote { 
            border-left: 3px solid var(--gold); 
            background: #fffcf0; 
            padding: 1rem; 
            margin: 1.5rem 0;
            border-radius: 0 8px 8px 0;
            font-style: italic;
        }

        .jargon-term {
          border-bottom: 1px dashed var(--gold);
          cursor: help;
          color: #92400e;
          font-weight: 600;
          transition: all 0.2s;
        }
        .jargon-term:hover { background: #fef3c7; }

        @keyframes scan {
          0% { transform: translateY(-100%); opacity: 0; }
          50% { opacity: 1; }
          100% { transform: translateY(100%); opacity: 0; }
        }
        .scan-line {
          position: absolute;
          width: 100%;
          height: 2px;
          background: var(--gold-light);
          box-shadow: 0 0 8px var(--gold-light);
          animation: scan 2s infinite linear;
        }

        @media print {
          .no-print { display: none !important; }
          body { background: white; color: black; }
          .message-bubble { border: 1px solid #ddd !important; box-shadow: none !important; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "marked": "https://esm.sh/marked@12.0.0"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
</body>
</html>
